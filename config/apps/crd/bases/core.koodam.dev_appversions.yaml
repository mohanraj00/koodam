          metadata:
            type: object
          spec:
            description: spec defines the desired state of AppVersion
            properties:
              appRef:
                description: |-
                  AppRef is the App of this version, in the same namespace. You cannot change it after
                  create.
                properties:
                  name:
                    description: Name is the name of the App.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.appRef is immutable.
                  rule: self == oldSelf
              budgetPerDay:
