    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AppVersion is one version of an App, with its own pods and its own gateway key. The rule for
          status.evidence is on the resource and not on the status, because status is optional: a rule
          on the status does not run for an update that removes the full status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AppVersion
            properties:
              appRef:
                description: |-
                  AppRef is the App of this version, in the same namespace. You cannot change it after
                  create.
                properties:
                  name:
                    description: Name is the name of the App.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.appRef is immutable.
                  rule: self == oldSelf
              budgetPerDay:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  BudgetPerDay is the maximum spend of the version key in one day, in the currency of the
                  gateway price table. It has no default, and it must be more than zero. You can change it.
                  The version keeps the same key. It is necessary if the template declares a model. A
                  version with no model has no key and no budget.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: budgetPerDay must be more than zero
                  rule: quantity(string(self)).isGreaterThan(quantity('0'))
              gate:
                description: |-
                  Gate is the evidence gate of the version. With a gate, the version gets no traffic until
                  the controller accepts an evidence record with the verdict pass for this version. A gated
                  version must name the image of the app container by digest. You cannot add, change or
                  remove the gate after create.
                properties:
                  nookku:
                    description: |-
                      Nookku is a scripted Nookku gate run. The controller runs it in a Job after each pod of
                      the version is Ready.
                    properties:
                      deadlineSeconds:
                        default: 1800
                        description: |-
                          DeadlineSeconds is the maximum time of the gate Job. After it, the gate has the reason
                          JobFailed.
                        format: int32
                        maximum: 86400
                        minimum: 1
                        type: integer
                      gateFile:
                        description: GateFile is the path of the gate file, relative
                          to the project root.
                        maxLength: 512
                        pattern: ^[A-Za-z0-9._][A-Za-z0-9._/-]*$
                        type: string
                        x-kubernetes-validations:
                        - message: gateFile must not have a .. part.
                          rule: '!self.split(''/'').exists(p, p == ''..'')'
                      image:
                        description: |-
                          Image is the gate image. Name it by digest, because the gate trusts the code of this
                          image.
                        maxLength: 1024
                        minLength: 1
                        type: string
                      root:
                        description: |-
                          Root is the absolute path of the project root in the image. The Job copies it to a work
                          volume before the run.
                        maxLength: 512
                        pattern: ^/[A-Za-z0-9._/-]*$
                        type: string
                        x-kubernetes-validations:
                        - message: root must not have a .. part.
                          rule: '!self.split(''/'').exists(p, p == ''..'')'
                    required:
                    - gateFile
                    - image
                    - root
                    type: object
                required:
                - nookku
                type: object
                x-kubernetes-validations:
                - message: spec.gate is immutable.
                  rule: self == oldSelf
              lifecycle:
                default: Active
                description: |-
                  Lifecycle is Active or Retiring. A change to Retiring stops new sessions. Then the version
                  drains and revokes its key. You cannot change Retiring back to Active.
                enum:
                - Active
                - Retiring
                type: string
                x-kubernetes-validations:
                - message: spec.lifecycle Retiring is terminal. You cannot change
                    it back to Active.
                  rule: oldSelf != 'Retiring' || self == 'Retiring'
              replicas:
                description: |-
                  Replicas is the number of pods of this version. You can change it. With no replicas and
                  no scale, the version has 1 pod. You cannot set replicas and scale together.
                format: int32
                minimum: 0
                type: integer
              scale:
                description: |-
                  Scale makes the number of pods follow the load of the version. The controller makes one
                  HorizontalPodAutoscaler for the version. You can change it, add it or remove it.
                properties:
                  maxReplicas:
                    description: MaxReplicas is the largest number of pods.
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  metric:
                    description: Metric is the load metric. Set cpu or pods, not the
                      two.
                    properties:
                      cpu:
                        description: |-
                          CPU scales on the CPU use of the pods, as a percent of the CPU request of the pods. The
                          cluster needs the resource metrics API, for example metrics-server.
                        properties:
                          averageUtilization:
                            description: AverageUtilization is the target CPU use
                              of each pod, as a percent of its CPU request.
                            format: int32
                            maximum: 1000
                            minimum: 1
                            type: integer
                        required:
                        - averageUtilization
                        type: object
                      pods:
                        description: |-
                          Pods scales on a metric that each pod of the version exports, for example the requests in
                          flight. The cluster needs a custom metrics adapter that serves the metric.
                        properties:
                          averageValue:
                            anyOf:
                            - type: integer
                            - type: string
                            description: AverageValue is the target value of the metric
                              for each pod.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                            x-kubernetes-validations:
                            - message: averageValue must be more than zero
                              rule: quantity(string(self)).isGreaterThan(quantity('0'))
                          name:
                            description: Name is the name of the metric in the custom
                              metrics API.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
                            type: string
                        required:
                        - averageValue
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: Set metric.cpu or metric.pods, not the two.
                      rule: has(self.cpu) != has(self.pods)
                  minReplicas:
                    default: 1
                    description: |-
                      MinReplicas is the smallest number of pods. A version with no load has this number. A
                      version in its drain also has this number.
                    format: int32
                    minimum: 1
                    type: integer
                required:
