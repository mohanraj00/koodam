                          image.
                        maxLength: 1024
                        minLength: 1
                        type: string
                      root:
                        description: |-
                          Root is the absolute path of the project root in the image. The Job copies it to a work
                          volume before the run.
                        maxLength: 512
                        pattern: ^/[A-Za-z0-9._/-]*$
