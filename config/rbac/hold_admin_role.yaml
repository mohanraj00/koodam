# This rule gives full access to the Hold objects. Bind it only to the cluster admins who
# stop or quarantine a workload in an incident, never to the users of a namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: koodam
    app.kubernetes.io/managed-by: kustomize
  name: hold-admin-role
rules:
- apiGroups:
  - core.koodam.dev
  resources:
  - holds
  verbs:
  - '*'
- apiGroups:
  - core.koodam.dev
  resources:
  - holds/status
  verbs:
  - get
