# The ceiling for the run Roles. The controller holds these rules and has no escalate or bind
# verb, so the API server refuses an Agent with spec.rules outside this ClusterRole. Add a rule
# here on purpose, with a reason in the PR.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: koodam
    app.kubernetes.io/managed-by: kustomize
  name: agent-ceiling
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "configmaps", "events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: koodam
    app.kubernetes.io/managed-by: kustomize
  name: agent-ceiling
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-ceiling
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
