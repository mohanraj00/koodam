                description: Env is added to the agent container, after the credentials
                  that the controller supplies.
                type: object
              harness:
                description: |-
                  Harness installs a coding harness binary in the pod before the agent starts. The binary is
                  in /koodam/bin, which is first on the PATH of the agent container. If Env has a PATH, the
                  controller does not change it, so that PATH must contain /koodam/bin.
                properties:
                  libc:
                    default: glibc
                    description: |-
                      Libc is the C library of the agent image. It selects the Claude Code build. The Codex
                      build is static.
                    enum:
                    - glibc
                    - musl
                    type: string
                  name:
                    description: Name is the harness. The binary is claude for claude-code
                      and codex for codex.
                    enum:
                    - claude-code
                    - codex
                    type: string
                  plugins:
                    description: |-
                      Plugins are the names of the harness presets. A preset is a named folder of files and rules
                      that the install has. The API has no list of the names. The controller has the list. If a
                      name is not in the list of the controller, an Agent fails and a Workspace gets a condition.
                      A preset can need more from the object. For example, the preset nookku needs a pod template
                      volume with the name nookku-tests in an Agent.
                    items:
                      description: HarnessPlugin is the name of a harness preset.
                        It is a DNS label.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                  version:
                    description: Version pins the harness version. If it is empty,
                      the pod gets the latest version.
                    pattern: ^([0-9]+\.[0-9]+\.[0-9]+)?$
                    type: string
                required:
                - name
                type: object
              image:
                description: Image is the agent container image.
                type: string
              ingressPort:
                description: |-
