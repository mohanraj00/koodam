            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Workspace
            properties:
              gateway:
                description: |-
                  Gateway gives the pod a gateway key. If it is empty, the pod gets no gateway key and the
                  harnesses use the subscription login only.
                properties:
                  budgetPerDay:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      BudgetPerDay is the maximum spend in one day, in the currency of the gateway price
                      table. The gateway refuses calls after the budget.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  model:
                    description: |-
                      Model is the gateway model name. It is the short form of a models list with 1 item. The
                      key permits only this model.
                    minLength: 1
                    type: string
                  models:
                    description: |-
                      Models are the gateway model names that the key permits. The gateway refuses a call to a
                      different model. The first model is the model of the harnesses. A TestKey of the Workspace
                      can permit only models of this list. Set model or models, and not the two. The list is
                      atomic, so an apply replaces it and keeps its order.
                    items:
                      maxLength: 253
                      minLength: 1
                      type: string
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: models must not have a model two times
                      rule: self.all(m, self.exists_one(n, n == m))
                required:
                - budgetPerDay
                type: object
                x-kubernetes-validations:
                - message: Set model or models, and not the two.
                  rule: has(self.model) != has(self.models)
              harnesses:
                description: Harnesses are the coding harnesses in the pod. Each name
                  occurs one time only.
                items:
                  description: |-
                    HarnessSpec selects the harness binary. An init container downloads it from the vendor and
                    checks its sha256. Koodam does not keep or redistribute a harness binary.
                  properties:
                    libc:
                      default: glibc
                      description: |-
                        Libc is the C library of the agent image. It selects the Claude Code build. The Codex
                        build is static.
                      enum:
                      - glibc
                      - musl
                      type: string
                    name:
                      description: Name is the harness. The binary is claude for claude-code
                        and codex for codex.
                      enum:
                      - claude-code
                      - codex
                      type: string
                    plugins:
                      description: |-
                        Plugins are the harness presets. The only value is nookku. At this stage, Koodam installs
                        no Nookku file. It gives only the Nookku test folder to the pod. For an Agent, nookku needs
                        a pod template volume with the name nookku-tests and a persistentVolumeClaim with a
                        claimName. The user owns that PVC. The API server does not look up the PVC. The controller
                        mounts the volume at /koodam/nookku-tests and sets NOOKKU_TESTS_DIR. For a Workspace, the
                        image makes /home/dev/nookku-tests on the home PVC and exports NOOKKU_TESTS_DIR in a login
                        shell. MaxItems is equal to the count of values in the enum. Make it larger
                        when you add a value.
                      items:
                        description: HarnessPlugin is a harness preset.
                        enum:
                        - nookku
                        type: string
                      maxItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    version:
                      description: Version pins the harness version. If it is empty,
                        the pod gets the latest version.
                      pattern: ^([0-9]+\.[0-9]+\.[0-9]+)?$
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
