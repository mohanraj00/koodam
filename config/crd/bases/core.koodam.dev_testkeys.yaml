---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: testkeys.core.koodam.dev
spec:
  group: core.koodam.dev
  names:
    kind: TestKey
    listKind: TestKeyList
    plural: testkeys
    singular: testkey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workspaceRef.name
      name: Workspace
      type: string
    - jsonPath: .spec.testID
      name: Test
      type: string
    - jsonPath: .spec.budget
      name: Budget
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TestKey is a request for one short-lived gateway key for one
          Nookku test in a Workspace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec defines the desired state of TestKey. It is immutable. The API server compares the
              budget and the TTL by value, thus "0.50" and "500m" are the same budget.
            properties:
              budget:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Budget is the maximum spend of this test key, in the currency of the gateway price table.
                  It must be more than zero. There is no default.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: budget must be more than zero
                  rule: quantity(string(self)).isGreaterThan(quantity('0'))
              testID:
                description: |-
                  TestID is the Nookku test ID. It has the same rule as the Nookku TEST_ID: a letter or a
                  digit, then letters, digits, "_" or "-". Nookku has no length limit, thus this field has no
                  length limit. The later controller makes a bounded key alias from the test ID and the TestKey UID.
                pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                type: string
              ttl:
                description: TTL is the maximum life of the key, for example "30m".
                  It must be more than zero.
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: ttl must be more than zero
                  rule: duration(self) > duration('0s')
              workspaceRef:
                description: WorkspaceRef is the Workspace in the same namespace that
                  gets the key.
                properties:
                  name:
                    description: Name is the name of the Workspace.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  uid:
                    description: UID is the UID of the Workspace. It stops a key for
                      a new Workspace with the same name.
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
            required:
            - budget
            - testID
            - ttl
            - workspaceRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self.workspaceRef == oldSelf.workspaceRef && self.testID == oldSelf.testID
                && quantity(string(self.budget)).compareTo(quantity(string(oldSelf.budget)))
                == 0 && duration(self.ttl) == duration(oldSelf.ttl)
          status:
            description: status defines the observed state of TestKey
            properties:
              conditions:
                description: |-
                  Conditions are the conditions of the TestKey. A message must not hold a key value or an
                  upstream error text.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: ExpiresAt is the time when the key stops.
                format: date-time
                type: string
              keyAlias:
                description: KeyAlias identifies the gateway key. It comes from the
                  test ID and the TestKey UID.
                maxLength: 256
                type: string
              keyHash:
                description: |-
                  KeyHash is the SHA-256 hash of the gateway key, as 64 hexadecimal characters. The gateway
                  refuses the hash for model calls, so it is not a credential.
                pattern: ^[a-f0-9]{64}$
                type: string
              revokedAt:
                description: RevokedAt is the time of the revoke of the key.
                format: date-time
                type: string
              usage:
                description: Usage is the gateway count after the revoke.
                properties:
                  calls:
                    description: Calls is the count of successful calls.
                    format: int64
                    type: integer
                  failedCalls:
                    description: FailedCalls is the count of refused or failed calls.
                    format: int64
                    type: integer
                  inputTokens:
                    description: InputTokens and OutputTokens are the sums over the
                      successful calls.
                    format: int64
                    type: integer
                  outputTokens:
                    format: int64
                    type: integer
                  spend:
                    description: Spend is the total spend of the key, as a decimal
                      string.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
