# `make install` builds this package by itself, and config/default builds it with the manager and
# the conversion webhook.
resources:
- bases/core.koodam.dev_agents.yaml
- bases/core.koodam.dev_approvalrecords.yaml
- bases/core.koodam.dev_holds.yaml
- bases/core.koodam.dev_profiles.yaml
- bases/core.koodam.dev_workspaces.yaml
- bases/core.koodam.dev_testkeys.yaml
- bases/core.koodam.dev_spendbudgets.yaml
# +kubebuilder:scaffold:crdkustomizeresource

# This package has no conversion patch. `make install` builds this package only, and it must not
# give a CRD that names a webhook Service that is not there. config/default adds the conversion
# webhook of the Agent, the TestKey and the Workspace (crd_conversion_patch.yaml).
# +kubebuilder:scaffold:crdkustomizewebhookpatch

# This configuration tells kustomize where a CRD names the conversion Service. config/default
# uses it to set the name and the namespace of that Service.
configurations:
- kustomizeconfig.yaml
