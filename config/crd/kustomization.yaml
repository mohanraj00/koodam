# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/core.koodam.dev_agents.yaml
- bases/core.koodam.dev_approvalrecords.yaml
- bases/core.koodam.dev_holds.yaml
- bases/core.koodam.dev_profiles.yaml
- bases/core.koodam.dev_workspaces.yaml
- bases/core.koodam.dev_testkeys.yaml
- bases/core.koodam.dev_spendbudgets.yaml
# +kubebuilder:scaffold:crdkustomizeresource

patches:
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix.
# patches here are for enabling the conversion webhook for each CRD
# Only the 3 kinds that differ between v1alpha1 and v1beta1 have the webhook. The 4 other kinds
# have the same schema in the two versions, so the API server converts them with no webhook.
- path: patches/webhook_in_agents.yaml
- path: patches/webhook_in_testkeys.yaml
- path: patches/webhook_in_workspaces.yaml
# +kubebuilder:scaffold:crdkustomizewebhookpatch

# [WEBHOOK] To enable webhook, uncomment the following section
# the following config is for teaching kustomize how to do kustomization for CRDs.
configurations:
- kustomizeconfig.yaml
