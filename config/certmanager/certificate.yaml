# The serving certificate of the conversion webhook. cert-manager makes it and puts its CA in the
# CRDs that have the annotation cert-manager.io/inject-ca-from. config/default sets the DNS names
# and the annotation.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: system
  labels:
    app.kubernetes.io/name: koodam
    app.kubernetes.io/managed-by: kustomize
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: conversion-cert
  namespace: system
  labels:
    app.kubernetes.io/name: koodam
    app.kubernetes.io/managed-by: kustomize
spec:
  dnsNames:
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: conversion-server-cert
