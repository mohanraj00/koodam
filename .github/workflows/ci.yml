name: CI
# The ci-ok skeleton of mohanraj00/.github, with the project jobs of koodam.
# A docs-only PR skips the project jobs, and ci-ok still passes. The check job always runs.
# Do not use paths-ignore, because a required check can then stay pending.
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # The classify step reads .github/gates.json from the base branch, so a PR cannot mark its own change as docs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - id: classify
        uses: mohanraj00/.github/gates@4d0656c141e5a5969bd72a5fe10636cc8dd9d524
        with:
          check: classify
  # The project check always runs. make check runs the Go unit tests and the Python tests of tools/.
  check:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - run: |
          go mod tidy
          make check
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
  test-e2e:
    name: E2E on kind
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    # The kind pin. docs/kind-pin.md says how to update it.
    env:
      KIND_VERSION: v0.33.0
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      # A PR from a fork fails here until the maintainer adds the label ok-to-test.
      # This step fails and does not skip, because a skipped job counts as a pass in ci-ok.
      - name: Check the label ok-to-test
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          !contains(github.event.pull_request.labels.*.name, 'ok-to-test')
        run: |
          echo "::error::A PR from a fork needs the label ok-to-test. After the maintainer adds it, push a commit or close and reopen the PR."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Install the pinned version of kind
        run: |
          base="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          file="kind-linux-$(go env GOARCH)"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/${file}.sha256sum"
          sha256sum --check "${file}.sha256sum"
          chmod +x "${file}"
          sudo mv "${file}" /usr/local/bin/kind
      - name: Verify kind installation
        run: kind version
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Run the e2e tests
        run: |
          go mod tidy
          make test-e2e
  # The seam test of the evidence gate. internal/evidence/nookku.pin has the pin of the Nookku release:
  # the version, the SHA-256 of the wheel and the commit of the tag. docs/evidence-gate.md has the design.
  seam:
    name: Seam test with the pinned Nookku
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      # The pattern permits only digits, the letters a to f and a dot, so a value cannot hold a command.
      - name: Read the pin
        id: pin
        run: |
          grep -E '^NOOKKU_(VERSION|WHEEL_SHA256|COMMIT)=[0-9a-f.]+$' internal/evidence/nookku.pin >> "$GITHUB_OUTPUT"
          test "$(grep -cE '^NOOKKU_(VERSION|WHEEL_SHA256|COMMIT)=[0-9a-f.]+$' internal/evidence/nookku.pin)" = 3
      - name: Get the gate cases of the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mohanraj00/nookku
          ref: ${{ steps.pin.outputs.NOOKKU_COMMIT }}
          path: nookku-cases
          sparse-checkout: conformance/gate
          persist-credentials: false
      # pip refuses a wheel with a different SHA-256. Nookku has no dependency.
      - name: Install the pinned wheel
        env:
          NOOKKU_VERSION: ${{ steps.pin.outputs.NOOKKU_VERSION }}
          NOOKKU_WHEEL_SHA256: ${{ steps.pin.outputs.NOOKKU_WHEEL_SHA256 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/nookku"
          printf 'nookku==%s --hash=sha256:%s\n' "$NOOKKU_VERSION" "$NOOKKU_WHEEL_SHA256" > "$RUNNER_TEMP/nookku.txt"
          "$RUNNER_TEMP/nookku/bin/pip" install --no-deps --only-binary :all: --require-hashes -r "$RUNNER_TEMP/nookku.txt"
      - name: Run the seam test
        env:
          KOODAM_SEAM: "1"
        run: |
          export KOODAM_SEAM_PYTHON="$RUNNER_TEMP/nookku/bin/python"
          export KOODAM_SEAM_CASES="$PWD/nookku-cases/conformance/gate"
          go test ./internal/evidence/ -run 'TestSeam|TestNookkuPin' -v
  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      # Fail if the code calls a function with a known vulnerability.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  chart:
    name: Lint and render the chart
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      # The check fails if a generated file is not the same as the output of make manifests generate helm-sync.
      - run: make generated-check
      # The check fails if the chart CRD or the chart RBAC is not the same as config/.
      - run: make helm-check
  # The spend-api binary embeds files from docs/ and internal/opspage/. This job builds the image
  # target, so a missing file in the build context fails the PR. It builds only when a PR changes
  # the paths below. The changes job does not gate it, because the docs/ files are not code paths.
  # A push to main always builds.
  spend-api-image:
    name: Build the spend-api image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the changed paths
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE...HEAD" -- cmd/spend-api internal/spendapi \
              internal/opspage docs/spend-api.openapi.json docs/spend_api.go Dockerfile .dockerignore | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the image
        if: steps.paths.outputs.build == 'true'
        run: make docker-build-spend-api SPEND_API_IMG=koodam-spend-api:ci
      - name: Check the image user
        if: steps.paths.outputs.build == 'true'
        run: test "$(docker image inspect -f '{{.Config.User}}' koodam-spend-api:ci)" = 65532:65532
  # The required check. Each project job is in needs. A skipped job passes. A failed or cancelled job fails.
  ci-ok:
    needs: [changes, check, lint, test-e2e, seam, govulncheck, chart, spend-api-image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Collect the project jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -B -I -c '
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = sorted(k for k, v in needs.items() if v["result"] not in ("success", "skipped"))
          if needs.get("changes", {}).get("result") != "success":
              bad = sorted(set(bad) | {"changes"})
          print("\n".join("%s: %s" % (k, v["result"]) for k, v in sorted(needs.items())))
          sys.exit("Failed jobs: " + ", ".join(bad) if bad else 0)
          '
