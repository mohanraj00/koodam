name: Image

# Push the controller image, the Workspace image, the Nookku data image and the spend-api image to
# GHCR only when a maintainer pushes a release tag. The tag push is the approval of each publication.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  image:
    permissions:
      contents: read
      packages: write
    name: Build and push the controller image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU builds the linux/arm64 image on the amd64 runner.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag v0.1.0 gives the image tags 0.1.0 and 0.1. The chart uses appVersion (0.1.0) as the default tag.
      - name: Make the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mohanraj00/koodam
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  workspace:
    permissions:
      contents: read
      packages: write
    name: Build and push the Workspace image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU builds the linux/arm64 image on the amd64 runner.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The chart uses appVersion as the default tag of workspace.image, the same as the controller.
      - name: Make the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mohanraj00/koodam-workspace
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/workspace
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  # The Nookku data image (#83) has the pinned Nookku files of internal/evidence/nookku.pin. The
  # chart value nookku.image gives its digest to the controller.
  nookku:
    permissions:
      contents: read
      packages: write
    name: Build and push the Nookku data image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same build arguments as make docker-build-nookku. The build refuses a wheel or a
      # plugin file with a different SHA-256.
      - name: Read the Nookku pin
        id: pin
        run: |
          test "$(grep -cE '^NOOKKU_(VERSION|WHEEL_SHA256|COMMIT)=[0-9a-f.]+$' internal/evidence/nookku.pin)" = 3
          {
            echo "args<<EOF"
            grep -E '^NOOKKU_(VERSION|WHEEL_SHA256|COMMIT)=[0-9a-f.]+$' internal/evidence/nookku.pin
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # QEMU builds the linux/arm64 image on the amd64 runner.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same tag rules as the controller image. The controller gets the image by its digest.
      - name: Make the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mohanraj00/koodam-nookku
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/nookku/Dockerfile
          build-args: ${{ steps.pin.outputs.args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # The chart value nookku.image needs this digest.
      - name: Show the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "ghcr.io/mohanraj00/koodam-nookku@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  # The spend-api image (#406) is the spend-api target of the root Dockerfile. It has the same base,
  # platforms, provenance and SBOM as the controller image.
  spend-api:
    permissions:
      contents: read
      packages: write
    name: Build and push the spend-api image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU builds the linux/arm64 image on the amd64 runner.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same tag rules as the controller image.
      - name: Make the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mohanraj00/koodam-spend-api
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: spend-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # The release checklist compares this digest with the digest of the published tag.
      - name: Show the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "ghcr.io/mohanraj00/koodam-spend-api@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
