name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  changes:
    # A push to main runs each job, so it does not need the docs check.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: ./.github/workflows/docs-only.yml

  lint:
    needs: changes
    # The job always runs and reports a check. A skipped job can report no check, and then the
    # ruleset blocks the PR. For a docs-only PR, the steps skip. If the docs check fails, the
    # steps run, so that a failure never skips the CI.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        if: needs.changes.outputs.docs-only != 'true'
        run: make lint-config
      - name: Run linter
        if: needs.changes.outputs.docs-only != 'true'
        run: make lint
