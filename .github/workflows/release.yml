name: Release

# A release tag vX.Y.Z publishes the koodam CLI, the release samples and the Helm chart. Only a maintainer pushes the tag.
# image.yml publishes the controller image for the same tag.
# A manual run (workflow_dispatch) or a PR that changes the release files is a dry run. It publishes nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - charts/**
      # The samples job runs this code.
      - test/e2e/egress_test.go
      - test/e2e/app_test.go
      - test/utils/samples.go

permissions: {}

env:
  CHART_DIR: charts/koodam
  CHART_REPO: oci://ghcr.io/mohanraj00/charts

jobs:
  # A kind run of the commit makes the release samples: the egress spans, the gateway logs and the
  # App ingress spans. docs/egress-spans.md names the files. The e2e tests check that they hold no
  # credential.
  samples:
    permissions:
      contents: read
    name: Make the release samples on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The kind pin is the same as in ci.yml. docs/kind-pin.md says how to update it.
    env:
      KIND_VERSION: v0.33.0
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      # A PR from a fork fails here until the maintainer adds the label ok-to-test, as in ci.yml.
      - name: Check the label ok-to-test
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          !contains(github.event.pull_request.labels.*.name, 'ok-to-test')
        run: |
          echo "::error::A PR from a fork needs the label ok-to-test. After the maintainer adds it, push a commit or close and reopen the PR."
          exit 1

      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install the pinned version of kind
        run: |
          base="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          file="kind-linux-$(go env GOARCH)"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/${file}.sha256sum"
          sha256sum --check "${file}.sha256sum"
          chmod +x "${file}"
          sudo mv "${file}" /usr/local/bin/kind

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      # Only the egress tests and the App tests run. The last egress test and the App sample test
      # write the samples to samples/. The inner quotes keep the filter in 1 word for the Makefile.
      - name: Run the egress and App e2e tests
        run: |
          go mod tidy
          make test-e2e E2E_ARGS="-ginkgo.label-filter='egress || app'" KOODAM_E2E_SAMPLES="$PWD/samples"

      - name: Keep the samples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-samples
          path: samples/*.jsonl
          if-no-files-found: error
          retention-days: 7

  # The dry run also runs on a tag. The publish jobs start only when it passes.
  dry-run:
    needs: samples
    permissions:
      contents: read
    name: Dry run (no publish)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Get the release samples
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-samples
          path: samples

      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

      # A snapshot builds the binaries and checksums.txt in dist/. It does not publish.
      - name: Build a snapshot of the CLI
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean

      # checksums.txt must have the SHA-256 of each sample.
      - name: Show the checksums
        run: |
          cat dist/checksums.txt
          grep -Eq ' egress-spans\.jsonl$' dist/checksums.txt
          grep -Eq ' gateway-log\.jsonl$' dist/checksums.txt
          grep -Eq ' app-ingress-spans\.jsonl$' dist/checksums.txt

      # The binary must show the snapshot version, not "dev". This shows that the ldflags set it.
      - name: Check the CLI version
        run: |
          set -- dist/koodam_linux_amd64*/koodam
          test "$#" -eq 1 && test -x "$1"
          out="$("$1" version)"
          echo "$out"
          case "$out" in
            "koodam dev" | "koodam ") exit 1 ;;
            "koodam "*) ;;
            *) exit 1 ;;
          esac

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      # The version 0.0.0-dryrun shows that the package step sets the version and appVersion.
      - name: Package the chart
        run: |
          helm package "$CHART_DIR" --version 0.0.0-dryrun --app-version 0.0.0-dryrun --destination dist/chart
          helm show chart dist/chart/koodam-0.0.0-dryrun.tgz

      - name: Keep the dry run output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/chart/*.tgz
            samples/*.jsonl
          retention-days: 7

  cli:
    needs: dry-run
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      # GoReleaser makes the GitHub release and uploads the binaries and checksums.txt to it.
      contents: write
    name: Publish the CLI release
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # GoReleaser uploads the samples and puts their SHA-256 in checksums.txt.
      - name: Get the release samples
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-samples
          path: samples

      - name: Publish the release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chart:
    needs: dry-run
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # Helm pushes the chart package to ghcr.io/mohanraj00/charts.
      packages: write
    name: Publish the Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      # The tag v0.1.0 gives the chart version and appVersion 0.1.0.
      # The chart uses appVersion as the default image tag, and image.yml pushes the image with the same tag.
      - name: Get the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "The tag $TAG is not vX.Y.Z." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination dist/chart

      - name: Push the chart to GHCR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'helm registry logout ghcr.io' EXIT
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "dist/chart/koodam-$VERSION.tgz" "$CHART_REPO"
