name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  changes:
    # A push to main runs each job, so it does not need the docs check.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: ./.github/workflows/docs-only.yml

  test-e2e:
    needs: changes
    # Run if the docs check fails, so that a failure never skips the CI.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    permissions:
      contents: read
    name: E2E on kind
    runs-on: ubuntu-latest
    steps:
      # A PR from a fork fails here until the maintainer adds the label ok-to-test.
      # This job fails and does not skip, because a skipped job counts as a pass for a required check.
      # There is no labeled trigger, because each other label then makes a skipped check run.
      - name: Check the label ok-to-test
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          !contains(github.event.pull_request.labels.*.name, 'ok-to-test')
        run: |
          echo "::error::A PR from a fork needs the label ok-to-test. After the maintainer adds it, push a commit or close and reopen the PR."
          exit 1

      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
