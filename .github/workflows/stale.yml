name: Stale PRs

# Closes an outside PR after 30 days with no activity.
# It uses the gh CLI because actions/stale cannot select PRs from forks only.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close:
    permissions:
      pull-requests: write
    name: Close stale outside PRs
    runs-on: ubuntu-latest
    steps:
      - name: Close outside PRs with no activity for 30 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAINTAINER: mohanraj00
          DAYS: "30"
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          gh pr list --state open --limit 500 --json number,isCrossRepository,author,updatedAt \
            --jq ".[] | select(.isCrossRepository and .author.login != \"$MAINTAINER\" and .updatedAt < \"$cutoff\") | .number" |
            while read -r pr; do
              echo "Close #$pr"
              gh pr close "$pr" --comment "This PR has no activity for $DAYS days, so it is closed. If you continue the work, reopen it or open a new PR."
            done
