name: Docs only

# The CI workflows call this workflow for a PR. It finds a PR that changes only docs files:
# *.md, the images in assets/ (png, svg, ico) and LICENSE. For such a PR, the CI jobs skip. A
# skipped job counts as a pass for a required check. The file list comes from the GitHub API, not
# from the code of the PR.
on:
  workflow_call:
    outputs:
      docs-only:
        description: "true if the PR changes only docs files"
        value: ${{ jobs.check.outputs.docs-only }}

permissions: {}

jobs:
  check:
    permissions:
      pull-requests: read
    name: Find a docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.files.outputs.docs-only }}
    steps:
      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')
          other=$(printf '%s\n' "$files" | grep -Ev '(\.md$|^assets/.*\.(png|svg|ico)$|^LICENSE$)' || true)
          docs=false
          if [ -n "$files" ] && [ -z "$other" ]; then docs=true; fi
          echo "docs-only=$docs" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs"
