name: Vulnerabilities

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  changes:
    # A push to main runs each job, so it does not need the docs check.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: ./.github/workflows/docs-only.yml

  govulncheck:
    needs: changes
    # Run if the docs check fails, so that a failure never skips the CI.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Fail if the code calls a function with a known vulnerability.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
