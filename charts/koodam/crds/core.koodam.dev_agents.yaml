---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agents.core.koodam.dev
spec:
  group: core.koodam.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .spec.budget
      name: Budget
      type: string
    - jsonPath: .status.usage.spend
      name: Spend
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is one agent run with its own credentials.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Agent
            properties:
              budget:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Budget is the maximum spend of the run, in the currency of the gateway price table.
                  The gateway refuses calls after the budget.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              command:
                description: Command is the entrypoint of the agent container.
                items:
                  type: string
                minItems: 1
                type: array
              deadlineSeconds:
                default: 900
                description: DeadlineSeconds stops the Job. The key TTL is this value
                  plus a grace period.
                format: int64
                minimum: 1
                type: integer
              env:
                additionalProperties:
                  type: string
                description: Env is added to the agent container, after the credentials
                  that the controller supplies.
                type: object
              harness:
                description: |-
                  Harness installs a coding harness binary in the pod before the agent starts. The binary is
                  in /koodam/bin, which is first on the PATH of the agent container. If Env has a PATH, the
                  controller does not change it, so that PATH must contain /koodam/bin.
                properties:
                  libc:
                    default: glibc
                    description: |-
                      Libc is the C library of the agent image. It selects the Claude Code build. The Codex
                      build is static.
                    enum:
                    - glibc
                    - musl
                    type: string
                  name:
                    description: Name is the harness. The binary is claude for claude-code
                      and codex for codex.
                    enum:
                    - claude-code
                    - codex
                    type: string
                  version:
                    description: Version pins the harness version. If it is empty,
                      the pod gets the latest version.
                    pattern: ^([0-9]+\.[0-9]+\.[0-9]+)?$
                    type: string
                required:
                - name
                type: object
              image:
                description: Image is the agent container image.
                type: string
              model:
                description: Model is the gateway model name. The key permits only
                  this model.
                minLength: 1
                type: string
              rules:
                description: Rules are the RBAC rules of the run Role, in the namespace
                  of the Agent only.
                items:
                  description: |-
                    PolicyRule holds information that describes a policy rule, but does not contain information
                    about who the rule applies to or which namespace the rule applies to.
                  properties:
                    apiGroups:
                      description: |-
                        apiGroups is the name of the APIGroup that contains the resources.  If multiple API groups are specified, any action requested against one of
                        the enumerated resources in any API group will be allowed. "" represents the core API group and "*" represents all API groups.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    nonResourceURLs:
                      description: |-
                        nonResourceURLs is a set of partial urls that a user should have access to.  *s are allowed, but only as the full, final step in the path
                        Since non-resource URLs are not namespaced, this field is only applicable for ClusterRoles referenced from a ClusterRoleBinding.
                        Rules can either apply to API resources (such as "pods" or "secrets") or non-resource URL paths (such as "/api"),  but not both.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    resourceNames:
                      description: resourceNames is an optional white list of names
                        that the rule applies to.  An empty set means that everything
                        is allowed.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    resources:
                      description: resources is a list of resources this rule applies
                        to. '*' represents all resources.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    verbs:
                      description: verbs is a list of Verbs that apply to ALL the
                        ResourceKinds contained in this rule. '*' represents all verbs.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - verbs
                  type: object
                type: array
              user:
                description: User is the person or the team that owns the run. It
                  goes into the key metadata.
                type: string
            required:
            - budget
            - command
            - image
            - model
            type: object
          status:
            description: status defines the observed state of Agent
            properties:
              completedAt:
                description: |-
                  CompletedAt is the end time of the run Job. For a failed Job, it is the time of the Failed
                  condition. The controller sets it one time only.
                format: date-time
                type: string
              conditions:
                description: 'Conditions: Provisioned, Revoked.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              job:
                description: Job is the name of the run Job.
                type: string
              keyAlias:
                description: KeyAlias identifies the gateway key. The key value is
                  never in the status.
                type: string
              keyHash:
                description: |-
                  KeyHash is the SHA-256 hash of the key. The controller writes it before it makes the key,
                  and uses it to block the key and to read the usage. The gateway refuses the hash for
                  model calls, so it is not a credential.
                type: string
              phase:
                description: Phase is the lifecycle phase.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              revokedAt:
                description: RevokedAt is the time when the controller blocked the
                  key and deleted the credentials.
                format: date-time
                type: string
              startedAt:
                description: StartedAt is the start time of the run Job. The controller
                  sets it one time only.
                format: date-time
                type: string
              usage:
                description: Usage is the gateway count after the revoke.
                properties:
                  calls:
                    description: Calls is the count of successful calls.
                    format: int64
                    type: integer
                  failedCalls:
                    description: FailedCalls is the count of refused or failed calls.
                    format: int64
                    type: integer
                  inputTokens:
                    description: InputTokens and OutputTokens are the sums over the
                      successful calls.
                    format: int64
                    type: integer
                  outputTokens:
                    format: int64
                    type: integer
                  spend:
                    description: Spend is the total spend of the key, as a decimal
                      string.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
