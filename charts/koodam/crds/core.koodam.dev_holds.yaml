---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: holds.core.koodam.dev
spec:
  group: core.koodam.dev
  names:
    kind: Hold
    listKind: HoldList
    plural: holds
    singular: hold
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.kind
      name: Kind
      type: string
    - jsonPath: .spec.target.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.user
      name: User
      type: string
    - jsonPath: .spec.release.user
      name: Released
      type: string
    - jsonPath: .status.conditions[?(@.type=="Held")].status
      name: Held
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Hold is an incident control: a kill switch (Stop) or a quarantine of a workload. It is
          cluster-scoped, and only an admin role can write it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Hold
            properties:
              action:
                description: Action is Stop or Quarantine.
                enum:
                - Stop
                - Quarantine
                type: string
                x-kubernetes-validations:
                - message: spec.action is immutable
                  rule: self == oldSelf
              reason:
                description: Reason tells why the Hold starts. The event of the Hold
                  and its span have this text.
                maxLength: 1024
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.reason is immutable
                  rule: self == oldSelf
              release:
                description: Release ends the Hold. The Hold stays as the record of
                  the incident.
                properties:
                  reason:
                    description: Reason tells why the Hold ends.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  user:
                    description: |-
                      User is the user that released the Hold. The admission policy of the Hold refuses a value
                      that is not the user of the request.
                    maxLength: 512
                    minLength: 1
                    type: string
                required:
                - reason
                - user
                type: object
              target:
                description: Target is the workload of the Hold.
                properties:
                  kind:
                    description: 'Kind is the kind of the workload: Agent, Workspace,
                      App, AppVersion or Profile.'
                    enum:
                    - Agent
                    - Workspace
                    - App
                    - AppVersion
                    - Profile
                    type: string
                  name:
                    description: Name is the name of the workload.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: Namespace is the namespace of the workload. A Profile
                      target has no namespace.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.target is immutable
                  rule: self == oldSelf
                - message: target.namespace is necessary for each kind other than
                    Profile, and a Profile target has no namespace
                  rule: 'self.kind == ''Profile'' ? !has(self.__namespace__) : has(self.__namespace__)'
              user:
                description: |-
                  User is the user that made the Hold. The admission policy of the Hold refuses a value that
                  is not the user of the request.
                maxLength: 512
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.user is immutable
                  rule: self == oldSelf
            required:
            - action
            - reason
            - target
            - user
            type: object
            x-kubernetes-validations:
            - message: spec.release is immutable after it is set
              rule: '!has(oldSelf.release) || (has(self.release) && self.release ==
                oldSelf.release)'
          status:
            description: status defines the observed state of Hold
            properties:
              conditions:
                description: 'Conditions are the conditions of the Hold: Held.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespaces:
                description: |-
                  Namespaces has one record for each namespace that the Profile of a Quarantine Hold binds.
                  The manager of each install writes the records of the namespaces that it watches. The Hold
                  is Quarantined only if each bound namespace has a record with the egress proxy.
                items:
                  description: HoldNamespaceStatus is the egress proxy cover of one
                    namespace of a Profile target.
                  properties:
                    egressProxy:
                      description: |-
                        EgressProxy is true if the install of the namespace has the egress proxy. Only the proxy
                        refuses the calls of a quarantined pod.
                      type: boolean
                    name:
                      description: Name is the name of the namespace.
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                  - egressProxy
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
