# The controller image. If the tag is empty, the chart uses the chart appVersion.
image:
  repository: ghcr.io/mohanraj00/koodam
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The default image for a Workspace with no spec.image.
# The chart always gives this image to the controller with the flag --workspace-image.
# If the tag is empty, the chart uses the chart appVersion, the same tag as the controller image.
# Then the controller and the workspace image are on the same release. If you set image.tag,
# also set workspace.image.tag to the same release.
# If the tag starts with "sha256:", the chart uses it as a digest (<repository>@<digest>).
workspace:
  image:
    repository: ghcr.io/mohanraj00/koodam-workspace
    tag: ""
  # A NetworkPolicy for the Workspace pods in each namespace of this list. The chart does not
  # read the Profiles, so add each Profile namespace here and run "helm upgrade". Each namespace
  # must exist before the install. The policy has an effect only if the CNI enforces it.
  # The policy blocks ingress by default. Pods can send traffic to DNS, the bundled gateway
  # and the targets in extraEgress. If publicInternet is true, pods can also reach public addresses.
  # If egressProxy.enabled is true, the egress is only the proxy pods, the API server rules of
  # egressProxy.networkPolicy.apiServer and extraEgress. The Agent pods get the same egress.
  # Then publicInternet and publicInternetPorts have no effect. dns and blockedCIDRs do not change
  # the policy of the pods, but the policy of the proxy uses them.
  networkPolicy:
    namespaces: []
    # The peers (NetworkPolicyPeer) that can connect to TCP port 2222. An empty list permits no ingress.
    sshFrom: []
    # The cluster DNS pods. The pods can send UDP and TCP port 53 to these pods.
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    # If true, the pods can reach each address outside the private, shared, link-local,
    # loopback and NAT64 ranges. These ranges include the cloud metadata address. The API server
    # refuses an IPv4-mapped range in a NetworkPolicy. The kernel sends an IPv4-mapped address as
    # IPv4, so the IPv4 ranges apply to it.
    publicInternet: true
    # The ports of the public internet rule. An empty list permits all ports. The default has
    # no port 53, so the pods can use only the cluster DNS.
    publicInternetPorts:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 22
    # More ranges that the public internet rule blocks. Add the public addresses of the API
    # server and the nodes, and the IPv6 ranges of the cluster, if they are public. An address
    # with no prefix length gets /32 or /128.
    blockedCIDRs: []
    # More egress rules (NetworkPolicyEgressRule). Use them for a gateway outside the bundled
    # mode, or for a cluster address that the pods must reach.
    extraEgress: []

# Use 1 replica. The controller uses leader election, so more replicas are standby replicas.
# The Nookku data image of the nookku plugin (#83, docs/nookku-preset.md). The image job pushes
# ghcr.io/mohanraj00/koodam-nookku on each release tag and shows its digest. If the value is set,
# the chart gives it to the controller with the flag --nookku-image. The reference must end with a
# digest (@sha256:<64 hex characters>), so that the files cannot change after the review. If the
# value is empty, the chart gives no flag, and a harness with the nookku plugin gets no Nookku files.
nookku:
  image: ""

replicaCount: 1
leaderElection: true

serviceAccount:
  # The ServiceAccount name. If empty, the chart uses "<fullname>-controller-manager".
  name: ""

# The LiteLLM gateway. Each Agent gets a key from this gateway.
gateway:
  # The gateway mode:
  # - "existing": the chart uses a gateway that you install. Set "url".
  # - "bundled": the chart installs LiteLLM and PostgreSQL. Refer to values-bundled.yaml.
  mode: existing
  # The LiteLLM admin address that the controller uses in the existing mode.
  # The existing mode has no default. If this value is empty, the install fails.
  # In the bundled mode, the controller uses the bundled LiteLLM Service and ignores this value.
  url: ""
  # The gateway address for the agent pods. If empty, the agent pods use the controller address.
  agentUrl: ""
  # The Secret with the LiteLLM master key. You make this Secret before the install.
  # The chart does not make it and does not read it. In the bundled mode, LiteLLM also uses it.
  masterKeySecret:
    name: koodam-gateway
    key: master-key
  # The values for the bundled mode only.
  bundled:
    litellm:
      # LiteLLM uses the MIT License. Use the image with the database support.
      # The digest pins the image. Do not use v1.107.0, latest or main-* (see the chart README).
      image: ghcr.io/berriai/litellm-database:v1.104.2@sha256:5a9ff0fd7177372f2ccd8949cb121f67e281f4d13d026af51f9c096c0626f50a
      # The time in seconds between the spend writes to the database.
      batchWriteSeconds: 1
      # The LiteLLM model_list. Each Agent model must be an alias in this list.
      # Helm writes small floats as "1e-06". Do not set a cost per token here.
      # To use an upstream key, write "api_key: os.environ/<NAME>" in a model.
      # Do not put a key value here. Helm writes modelList into a ConfigMap and the release values.
      # An item can have the key "zone". With zone.name, the route list has only the items with
      # no zone or with the zone of the install, and a call for a model name of a different zone
      # gets the status 403 (RouteOutOfZone). docs/zones.md has the rules.
      modelList: []
      # The env variables for the upstream provider keys. Each variable comes from a Secret
      # that you make. The chart does not make or read these Secrets. For example:
      #   extraEnvFromSecrets:
      #   - name: ANTHROPIC_API_KEY
      #     secretName: upstream-keys
      #     secretKey: anthropic
      extraEnvFromSecrets: []
      resources: {}
      # The image user is root. LiteLLM also runs as the user "nobody" (65534).
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
    # The guard for instructions in untrusted content (docs/gateway-guard.md). The gateway examines
    # the tool replies and the documents of each model request with fixed rules, and it writes one
    # log line for each new block. It is a tripwire for known forms, not a defense. The egress
    # policy stays the boundary.
    guard:
      enabled: false
      # record: write the line and send the request with no change.
      # mark: put a fixed notice line before each matched block, then send the request.
      # block: refuse the request with the status 403 and the reason UntrustedInstruction.
      action: record
      # The sources to examine: toolResult and document.
      sources: [toolResult, document]
      # The guard examines at most this count of bytes of each block.
      maxBytes: 65536
    # A model that LiteLLM answers itself (mock_response), with no model server.
    # The cost per token makes the spend more than zero. Use it for tests only.
    mock:
      enabled: false
      modelName: mock-1
      response: "mock answer"
      # Write the costs as strings, so that Helm keeps the number format.
      inputCostPerToken: "0.000001"
      outputCostPerToken: "0.000002"
    postgres:
      # PostgreSQL uses the PostgreSQL License. The digest pins the image.
      image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      # The Secret with the database password. If name is empty, the chart makes the
      # Secret "<fullname>-postgres" with a random password and keeps the password on upgrade.
      # Use only URL-safe characters in a password that you supply.
      passwordSecret:
        name: ""
        key: password
      # If persistence.enabled is false, the data is in an emptyDir. A new pod starts with no data.
      persistence:
        enabled: false
        size: 1Gi
        storageClassName: ""
      resources: {}
      # The user "postgres" in the alpine image is 70. fsGroup lets this user write the data volume.
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL

# The time that the controller adds to deadlineSeconds for the key TTL.
keyGrace: 1m

# The time in seconds that the controller keeps a run Job and its pods after the Job ends.
# The pod keeps the log, so "koodam logs" works for this time. The Agent keeps the result.
# If the controller is down, the Jobs stay until it starts again.
# The value must be from 60 to 2147483647. The default is 86400 (24 h).
jobTTLSeconds: 86400

# The egress proxy (traced egress). It writes one JSON line for each call of an Agent pod or a
# Workspace pod to its stdout. It uses the manager image. If workspace.networkPolicy.namespaces
# has items, the proxy watches the pods only in these namespaces, with a Role in each namespace.
# Else it gets a ClusterRole. Both give get, list and watch on pods. The proxy refuses a call from
# a pod that it cannot find, for example a pod in a namespace that is not in the list.
egressProxy:
  enabled: false
  # A fixed IPv4 ClusterIP in the Service range of the cluster. The pods use this address as
  # their DNS server and their proxy. It is necessary if enabled is true.
  clusterIP: ""
  port: 3128
  # The permitted ports for plain HTTP and for CONNECT. Each list must have items.
  httpPorts: ["80"]
  connectPorts: ["443"]
  # The DNS responder of the Koodam pods. It sends a name in clusterDomain to clusterDNS, and
  # answers each other name with clusterIP.
  dns:
    clusterDNS: kube-dns.kube-system.svc.cluster.local:53
    clusterDomain: cluster.local
  replicas: 2
  resources:
    limits:
      cpu: "1"
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # The affinity of the proxy pods. The top-level affinity does not apply to the proxy pods.
  affinity: {}
  # The default spreads the proxy pods across the nodes. ScheduleAnyway lets all the pods start
  # on a cluster with one node. If an item has no labelSelector, the chart adds the labels of the
  # proxy pods of this release. Set [] for no spread.
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  # A PodDisruptionBudget for the proxy pods. maxUnavailable is a number or a percentage.
  # With 1 replica and maxUnavailable 1, a node drain stops the proxy for a short time.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  networkPolicy:
    # If true, the proxy pods can send only to the DNS pods of workspace.networkPolicy.dns, the
    # bundled gateway, the API server, and the public internet (the ranges of the Workspace policy
    # and workspace.networkPolicy.blockedCIDRs) on httpPorts and connectPorts. They get ingress
    # on the proxy port from the Agent and Workspace pods only, and on the probe port.
    enabled: true
    # The egress rules (NetworkPolicyEgressRule) to the API server, for the pod watch. They are
    # necessary if enabled is true. The rules apply after the Service address changes to the
    # endpoint address, so use the endpoint addresses: kubectl get endpointslices -l
    # kubernetes.io/service-name=kubernetes. For example:
    #   - to:
    #     - ipBlock:
    #         cidr: 172.18.0.2/32
    #     ports:
    #     - protocol: TCP
    #       port: 6443
    apiServer: []
    # More egress rules (NetworkPolicyEgressRule), for example for a gateway at a private address.
    extraEgress: []

# Apps. If enabled is true, the chart installs the App, AppVersion and TenantQuota CRDs, the App
# role and the ValidatingAdmissionPolicy of the AppVersion, and the manager runs the App
# controllers. An App endpoint needs a Gateway API implementation in the cluster. The chart does
# not install one. Helm keeps the App CRDs on an uninstall, so that the Apps of the cluster stay.
# With egressProxy.enabled, name each namespace of the Apps in workspace.networkPolicy.namespaces:
# the proxy gives an App pod an identity only in a named namespace.
apps:
  enabled: false
  # The App CRDs and the admission policy of the AppVersion are for the full cluster. Each
  # cluster has them one time. Set false in the second install of a cluster.
  sharedResources: true
  # The namespaces whose pods can send traffic to the App pods, for example the namespace of the
  # Gateway data plane. It has an effect only with egressProxy.enabled: then each AppVersion has
  # a NetworkPolicy, and that policy permits no ingress if this list is empty.
  ingressNamespaces: []
  # The egress rules (NetworkPolicyEgressRule) to the API server for AppVersions with template.rules.
  # Use the API server endpoint addresses, as in egressProxy.networkPolicy.apiServer.
  # A list with rules needs egressProxy.enabled and apps.sharedResources. It permits template.rules
  # in the namespaces the manager watches. An empty list keeps the admission refusal.
  apiServerEgress: []
  # The signed claim check at the ingress of each App. With an issuer, each AppVersion pod gets a
  # check container, and a request with no valid JWT of the issuer gets the status 401. The check
  # accepts RS256 and ES256. An issuer needs egressProxy.enabled, because only then a
  # NetworkPolicy stops a direct call to the app container. With no egress proxy, the chart
  # refuses the issuer.
  claimCheck:
    # The necessary value of the claim iss. If it is empty, the Apps have no claim check.
    issuer: ""
    # A value that the claim aud must have.
    audience: ""
    # The claim with the caller label. The app container gets it in the header Koodam-Caller.
    callerClaim: sub
    # The claim with the tenant label. The app container gets it in the header Koodam-Tenant. If
    # it is empty, the check reads no tenant label.
    tenantClaim: ""
    # With a tenant claim, bind each model call of an App pod to the tenant of a request. The
    # check container gives the app a signed token in the header Koodam-Tenant-Token, with a life
    # of 10 minutes. The app must send this header with each model call, or the egress proxy
    # refuses the call. The proxy also gives each model call of an Agent pod and a Workspace pod
    # the reserved customer koodam-no-tenant. If false, the gateway counts a model call for the
    # tenant label that the code in the pod sends, and that code is not trusted.
    tenantToken: true
    # The claim with the zone of the caller. With it, a request with a zone claim that is not
    # zone.name gets the status 403 and the reason ZoneMismatch. It needs zone.name. If it is
    # empty, the check reads no zone. docs/zones.md has the rules.
    zoneClaim: ""
    # The JWKS document of the issuer, as text. It has public keys only: the manager refuses a
    # document with private or symmetric key material. A change of this value starts the manager
    # again, and then each AppVersion gets new pods.
    jwks: ""

# The zone of this install. One install is one zone: a workload, its model routes and its egress
# stay in the zone of the install. docs/zones.md has the design, and the steps for 2 installs in
# one cluster.
zone:
  # The name of the zone, as a DNS label, for example "zone-a". Empty: the install has no zone.
  name: ""
  # The namespaces of this install. With items, the manager reads the namespaced objects of
  # these namespaces and of the release namespace only. Empty: each namespace of the cluster.
  # It is necessary if the cluster has 2 installs, and 2 installs must not have the same
  # namespace.
  namespaces: []
  # Refuse a request to an App with no zone claim in its token (ZoneMismatch). By default, the
  # claim check accepts such a request. It needs apps.claimCheck.issuer and
  # apps.claimCheck.zoneClaim.
  requireClaim: false
  # The declared zone of egress hosts, as a map from a host to a zone. The egress proxy refuses a
  # call to a host with a zone that is not zone.name (EgressOutOfZone). A host is a DNS name, or
  # "*." and a DNS name for each name below it. A host with no entry follows the usual egress
  # rules. It needs zone.name and egressProxy.enabled. For example:
  #   egressHosts:
  #     models.zone-b.example.com: zone-b
  #     "*.zone-b.example.net": zone-b
  egressHosts: {}
  # The values of the node labels topology.kubernetes.io/zone and topology.kubernetes.io/region
  # on the nodes of the zone. An admission policy refuses an AppVersion with a node selector or
  # a node affinity for a different value (ZonePlacement). Empty: only the value of zone.name is
  # permitted. It needs zone.name and apps.enabled.
  topologyValues: []
  # The storage classes of the zone. With items, an admission policy refuses a new
  # PersistentVolumeClaim of the install namespaces, and a volume claim of an AppVersion pod
  # template, with a different storage class (ZonePlacement). The home claim of a new Workspace
  # gets the first class of the list. Empty: no storage check. It needs zone.name,
  # zone.namespaces and apps.enabled.
  storageClasses: []

# The tenants of the Apps. A TenantQuota gives one tenant label its quota and its rate limit.
# The controller reads the use of each tenant from the gateway. defaultQuota and refuseUnknown
# are for a tenant label with no TenantQuota, and they need apps.claimCheck.tenantClaim.
tenants:
  # The quota of a tenant label with no TenantQuota. With no rate, such a tenant has no limit.
  defaultQuota:
    rateLimit:
      # The requests for each second, as a quantity, for example "5" or "500m". Empty: no limit.
      requestsPerSecond: ""
      # The count of requests that such a tenant can send at one time. 0: the rate, with a
      # minimum of 1.
      burst: 0
  # If true, the claim check refuses a tenant label with no TenantQuota, with the status 403 and
  # the reason UnknownTenant. Then defaultQuota has no effect.
  refuseUnknown: false
  # The time between 2 reads of the use of a tenant from the gateway. It is 1s or more.
  usageInterval: 30s

# The 7 core CRDs and their conversion webhook. The API server calls the webhook to convert an
# Agent, a Workspace or a TestKey between v1alpha1 and v1beta1. The webhook is a separate
# Deployment with no API token. It uses the controller image.
conversion:
  # A cluster has the CRDs and the webhook one time, because each CRD names one webhook Service.
  # Set false in the second install of a cluster.
  enabled: true
  # With 2 or more replicas, the chart adds a PodDisruptionBudget with minAvailable 1.
  replicas: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi
  # The policy permits ingress only on the webhook port and permits no egress. It has an effect
  # only if the CNI enforces it.
  networkPolicy:
    enabled: true
    # The peers (NetworkPolicyPeer) that can connect to the webhook port. Only the API server
    # calls the webhook. An empty list permits each source, because the source address of the
    # API server is different on each cluster and is frequently not a pod. Set the address range
    # of the control plane here, for example:
    #   from:
    #   - ipBlock:
    #       cidr: 10.0.0.0/28
    # The kubelet probes must also reach the port: most CNIs always permit the node of the pod.
    from: []
  # The serving certificate of the webhook. With no value here, the chart makes a CA and a
  # certificate for 10 years at the first install and keeps them in the Secret
  # <release>-conversion-tls. To make a new certificate, delete the Secret and run "helm upgrade".
  # The chart reads the Secret from the cluster. A tool that renders the chart with no cluster
  # access makes a new certificate at each render: use one of the two options below with it.
  tls:
    # A Secret in the release namespace with tls.crt and tls.key. The certificate must be valid
    # for <release>-conversion.<namespace>.svc. caBundle is then necessary: the CA certificate
    # of the Secret, in PEM, with base64 encoding.
    existingSecret: ""
    caBundle: ""
    # cert-manager makes the certificate and puts its CA in the CRDs. With no issuerRef.name, the
    # chart makes a self-signed Issuer.
    certManager:
      enabled: false
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io

# The metrics endpoint (HTTPS). If true, the chart adds the metrics Service and the
# metrics-auth ClusterRole (tokenreviews and subjectaccessreviews, verb create).
metrics:
  enabled: false
  port: 8443
  # A ServiceMonitor of the Prometheus Operator for the metrics Service. It needs metrics.enabled.
  # docs/metrics.md has the ClusterRole that the Prometheus service account needs.
  serviceMonitor:
    enabled: false
    # Labels that your Prometheus uses to select a ServiceMonitor.
    labels: {}
    # The scrape interval, for example 30s. Empty uses the Prometheus default.
    interval: ""
    # The chart endpoint uses a self-signed certificate. If you give the controller a certificate
    # with --metrics-cert-path, set the CA and the server name here.
    tlsConfig:
      insecureSkipVerify: true

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
