# The controller image. If the tag is empty, the chart uses the chart appVersion.
image:
  repository: ghcr.io/mohanraj00/koodam
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Use 1 replica. The controller uses leader election, so more replicas are standby replicas.
replicaCount: 1
leaderElection: true

serviceAccount:
  # The ServiceAccount name. If empty, the chart uses "<fullname>-controller-manager".
  name: ""

# The LiteLLM gateway. Each Agent gets a key from this gateway.
gateway:
  # The gateway mode:
  # - "existing": the chart uses a gateway that you install. Set "url".
  # - "bundled": the chart installs LiteLLM and PostgreSQL. Refer to values-bundled.yaml.
  mode: existing
  # The LiteLLM admin address that the controller uses in the existing mode.
  # The existing mode has no default. If this value is empty, the install fails.
  # In the bundled mode, the controller uses the bundled LiteLLM Service and ignores this value.
  url: ""
  # The gateway address for the agent pods. If empty, the agent pods use the controller address.
  agentUrl: ""
  # The Secret with the LiteLLM master key. You make this Secret before the install.
  # The chart does not make it and does not read it. In the bundled mode, LiteLLM also uses it.
  masterKeySecret:
    name: koodam-gateway
    key: master-key
  # The values for the bundled mode only.
  bundled:
    litellm:
      # LiteLLM uses the MIT License. Use the image with the database support.
      image: ghcr.io/berriai/litellm-database:v1.104.2
      # The time in seconds between the spend writes to the database.
      batchWriteSeconds: 1
      # The LiteLLM model_list. Each Agent model must be an alias in this list.
      # Helm writes small floats as "1e-06". Do not set a cost per token here.
      modelList: []
      resources: {}
      # The image user is root. LiteLLM also runs as the user "nobody" (65534).
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
    # A model that LiteLLM answers itself (mock_response), with no model server.
    # The cost per token makes the spend more than zero. Use it for tests only.
    mock:
      enabled: false
      modelName: mock-1
      response: "mock answer"
      # Write the costs as strings, so that Helm keeps the number format.
      inputCostPerToken: "0.000001"
      outputCostPerToken: "0.000002"
    postgres:
      # PostgreSQL uses the PostgreSQL License.
      image: docker.io/library/postgres:16-alpine
      # The Secret with the database password. If name is empty, the chart makes the
      # Secret "<fullname>-postgres" with a random password and keeps the password on upgrade.
      # Use only URL-safe characters in a password that you supply.
      passwordSecret:
        name: ""
        key: password
      # If persistence.enabled is false, the data is in an emptyDir. A new pod starts with no data.
      persistence:
        enabled: false
        size: 1Gi
        storageClassName: ""
      resources: {}
      # The user "postgres" in the alpine image is 70. fsGroup lets this user write the data volume.
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL

# The time that the controller adds to deadlineSeconds for the key TTL.
keyGrace: 1m

# The time in seconds that Kubernetes keeps a run Job and its pods after the Job ends.
# The pod keeps the log, so "koodam logs" works for this time. The Agent keeps the result.
# The minimum is 60. The default is 86400 (24 h).
jobTTLSeconds: 86400

# The metrics endpoint (HTTPS). If true, the chart adds the metrics Service and the
# metrics-auth ClusterRole (tokenreviews and subjectaccessreviews, verb create).
metrics:
  enabled: false
  port: 8443

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
