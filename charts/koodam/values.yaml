# The controller image. If the tag is empty, the chart uses the chart appVersion.
image:
  repository: ghcr.io/mohanraj00/koodam
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The default image for a Workspace with no spec.image.
# The chart always gives this image to the controller with the flag --workspace-image.
# If the tag is empty, the chart uses the chart appVersion, the same tag as the controller image.
# Then the controller and the workspace image are on the same release. If you set image.tag,
# also set workspace.image.tag to the same release.
# If the tag starts with "sha256:", the chart uses it as a digest (<repository>@<digest>).
workspace:
  image:
    repository: ghcr.io/mohanraj00/koodam-workspace
    tag: ""
  # A NetworkPolicy for the Workspace pods in each namespace of this list. The chart does not
  # read the Profiles, so add each Profile namespace here and run "helm upgrade". Each namespace
  # must exist before the install. The policy has an effect only if the CNI enforces it.
  # Ingress: only TCP 2222 (sshd). Egress: DNS, the bundled gateway, the public internet if
  # publicInternet is true, and the rules of extraEgress. Other traffic is blocked.
  networkPolicy:
    namespaces: []
    # The cluster DNS pods. The pods can send UDP and TCP port 53 to these pods.
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    # If true, the pods can reach each address outside the private, shared, link-local,
    # loopback and NAT64 ranges. These ranges include the cloud metadata address. The API server
    # refuses an IPv4-mapped range in a NetworkPolicy. The kernel sends an IPv4-mapped address as
    # IPv4, so the IPv4 ranges apply to it.
    publicInternet: true
    # The ports of the public internet rule. An empty list permits all ports. The default has
    # no port 53, so the pods can use only the cluster DNS.
    publicInternetPorts:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 22
    # More ranges that the public internet rule blocks. Add the public addresses of the API
    # server and the nodes, and the IPv6 ranges of the cluster, if they are public. An address
    # with no prefix length gets /32 or /128.
    blockedCIDRs: []
    # More egress rules (NetworkPolicyEgressRule). Use them for a gateway outside the bundled
    # mode, or for a cluster address that the pods must reach.
    extraEgress: []

# Use 1 replica. The controller uses leader election, so more replicas are standby replicas.
replicaCount: 1
leaderElection: true

serviceAccount:
  # The ServiceAccount name. If empty, the chart uses "<fullname>-controller-manager".
  name: ""

# The LiteLLM gateway. Each Agent gets a key from this gateway.
gateway:
  # The gateway mode:
  # - "existing": the chart uses a gateway that you install. Set "url".
  # - "bundled": the chart installs LiteLLM and PostgreSQL. Refer to values-bundled.yaml.
  mode: existing
  # The LiteLLM admin address that the controller uses in the existing mode.
  # The existing mode has no default. If this value is empty, the install fails.
  # In the bundled mode, the controller uses the bundled LiteLLM Service and ignores this value.
  url: ""
  # The gateway address for the agent pods. If empty, the agent pods use the controller address.
  agentUrl: ""
  # The Secret with the LiteLLM master key. You make this Secret before the install.
  # The chart does not make it and does not read it. In the bundled mode, LiteLLM also uses it.
  masterKeySecret:
    name: koodam-gateway
    key: master-key
  # The values for the bundled mode only.
  bundled:
    litellm:
      # LiteLLM uses the MIT License. Use the image with the database support.
      # The digest pins the image. Do not use v1.107.0, latest or main-* (see the chart README).
      image: ghcr.io/berriai/litellm-database:v1.104.2@sha256:5a9ff0fd7177372f2ccd8949cb121f67e281f4d13d026af51f9c096c0626f50a
      # The time in seconds between the spend writes to the database.
      batchWriteSeconds: 1
      # The LiteLLM model_list. Each Agent model must be an alias in this list.
      # Helm writes small floats as "1e-06". Do not set a cost per token here.
      # To use an upstream key, write "api_key: os.environ/<NAME>" in a model.
      # Do not put a key value here. Helm writes modelList into a ConfigMap and the release values.
      modelList: []
      # The env variables for the upstream provider keys. Each variable comes from a Secret
      # that you make. The chart does not make or read these Secrets. For example:
      #   extraEnvFromSecrets:
      #   - name: ANTHROPIC_API_KEY
      #     secretName: upstream-keys
      #     secretKey: anthropic
      extraEnvFromSecrets: []
      resources: {}
      # The image user is root. LiteLLM also runs as the user "nobody" (65534).
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
    # A model that LiteLLM answers itself (mock_response), with no model server.
    # The cost per token makes the spend more than zero. Use it for tests only.
    mock:
      enabled: false
      modelName: mock-1
      response: "mock answer"
      # Write the costs as strings, so that Helm keeps the number format.
      inputCostPerToken: "0.000001"
      outputCostPerToken: "0.000002"
    postgres:
      # PostgreSQL uses the PostgreSQL License. The digest pins the image.
      image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      # The Secret with the database password. If name is empty, the chart makes the
      # Secret "<fullname>-postgres" with a random password and keeps the password on upgrade.
      # Use only URL-safe characters in a password that you supply.
      passwordSecret:
        name: ""
        key: password
      # If persistence.enabled is false, the data is in an emptyDir. A new pod starts with no data.
      persistence:
        enabled: false
        size: 1Gi
        storageClassName: ""
      resources: {}
      # The user "postgres" in the alpine image is 70. fsGroup lets this user write the data volume.
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL

# The time that the controller adds to deadlineSeconds for the key TTL.
keyGrace: 1m

# The time in seconds that the controller keeps a run Job and its pods after the Job ends.
# The pod keeps the log, so "koodam logs" works for this time. The Agent keeps the result.
# If the controller is down, the Jobs stay until it starts again.
# The value must be from 60 to 2147483647. The default is 86400 (24 h).
jobTTLSeconds: 86400

# The egress proxy (traced egress). It writes one JSON line for each call of an Agent pod or a
# Workspace pod to its stdout. It uses the manager image. If workspace.networkPolicy.namespaces
# has items, the proxy watches the pods only in these namespaces, with a Role in each namespace.
# Else it gets a ClusterRole. Both give get, list and watch on pods. The proxy refuses a call from
# a pod that it cannot find, for example a pod in a namespace that is not in the list.
egressProxy:
  enabled: false
  # A fixed ClusterIP in the Service range of the cluster. The pods use this address, so they
  # need no DNS. It is necessary if enabled is true.
  clusterIP: ""
  port: 3128
  # The permitted ports for plain HTTP and for CONNECT. Each list must have items.
  httpPorts: ["80"]
  connectPorts: ["443"]
  replicas: 2
  resources:
    limits:
      cpu: "1"
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  networkPolicy:
    # If true, the proxy pods can send only to DNS, the bundled gateway, the API server and the
    # public internet (the ranges and blockedCIDRs of workspace.networkPolicy). They get ingress
    # only on the proxy port.
    enabled: true
    # The egress rules (NetworkPolicyEgressRule) to the API server, for the pod watch. They are
    # necessary if enabled is true. The rules apply after the Service address changes to the
    # endpoint address, so use the endpoint addresses: kubectl get endpointslices -l
    # kubernetes.io/service-name=kubernetes. For example:
    #   - to:
    #     - ipBlock:
    #         cidr: 172.18.0.2/32
    #     ports:
    #     - protocol: TCP
    #       port: 6443
    apiServer: []
    # More egress rules (NetworkPolicyEgressRule), for example for a gateway at a private address.
    extraEgress: []

# The metrics endpoint (HTTPS). If true, the chart adds the metrics Service and the
# metrics-auth ClusterRole (tokenreviews and subjectaccessreviews, verb create).
metrics:
  enabled: false
  port: 8443

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
