{{- $np := dig "networkPolicy" dict (.Values.workspace | default dict) | default dict -}}
{{- $ep := .Values.egressProxy -}}
{{- range $ns := $np.namespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koodam.fullname" $ | trunc 47 | trimSuffix "-" }}-workspace
  namespace: {{ $ns }}
  labels:
    {{- include "koodam.labels" $ | nindent 4 }}
spec:
  # Each pod of a Workspace has this label.
  podSelector:
    matchExpressions:
    - key: koodam.dev/workspace
      operator: Exists
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 2222
  egress:
  {{- if $ep.enabled }}
  {{- include "koodam.proxyEgress" $ | nindent 2 }}
  {{- else }}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $np.dns.namespace }}
      podSelector:
        matchLabels:
          {{- toYaml $np.dns.podLabels | nindent 10 }}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  {{- if eq $.Values.gateway.mode "bundled" }}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $.Release.Namespace }}
      podSelector:
        matchLabels:
          {{- include "koodam.gatewaySelector" (list $ "litellm") | nindent 10 }}
    ports:
    - protocol: TCP
      port: 4000
  {{- end }}
  {{- if $np.publicInternet }}
  - to:
    {{- include "koodam.publicPeers" $np.blockedCIDRs | nindent 4 }}
    {{- with $np.publicInternetPorts }}
    ports:
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- with $np.extraEgress }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- if $ep.enabled }}
---
# With the egress proxy, the Agent run pods get the same egress as the Workspace pods, and no
# ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koodam.fullname" $ | trunc 51 | trimSuffix "-" }}-agent
  namespace: {{ $ns }}
  labels:
    {{- include "koodam.labels" $ | nindent 4 }}
spec:
  # Each pod of an Agent run has this label.
  podSelector:
    matchExpressions:
    - key: koodam.dev/agent
      operator: Exists
  policyTypes:
  - Ingress
  - Egress
  egress:
  {{- include "koodam.proxyEgress" $ | nindent 2 }}
  {{- with $np.extraEgress }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
