{{- if .Values.apps.enabled }}
{{- $fullname := include "koodam.fullname" . -}}
{{- /* The App CRDs come from config/apps/crd/bases (controller-gen). Helm keeps them on an uninstall. */ -}}
{{- range $file := list "files/app-crd-apps.yaml" "files/app-crd-appversions.yaml" }}
{{- $crd := $.Files.Get $file | fromYaml }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") ($crd.metadata.annotations | default dict)) }}
{{- $_ := set $crd.metadata "labels" (include "koodam.labels" $ | fromYaml) }}
{{ toYaml $crd }}
---
{{- end }}
# The ValidatingAdmissionPolicy of the AppVersion and its binding. They come from
# config/apps/admission/policy.yaml.
{{ .Files.Get "files/app-admission-policy.yaml" }}
---
# The rules of the App controllers. They come from config/apps/rbac/role.yaml (controller-gen).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-app-manager-role
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
rules:
{{ include "koodam.rules" (dict "ctx" . "file" "files/app-manager-role.yaml") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-app-manager-rolebinding
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-app-manager-role
subjects:
{{ include "koodam.subject" . }}
{{- with .Values.apps.claimCheck }}
{{- if .issuer }}
---
# The JWKS of the issuer of the App claim check. The manager reads it and gives it to the check
# container of each AppVersion pod. It has public keys only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-app-claim-jwks
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "koodam.labels" $ | nindent 4 }}
data:
  jwks.json: {{ required "apps.claimCheck.jwks is necessary with an issuer." .jwks | quote }}
{{- end }}
{{- end }}
{{- end }}
