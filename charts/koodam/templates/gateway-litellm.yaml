{{- /*
koodam.litellmRoutes sorts gateway.bundled.litellm.modelList by the zone of the install. It gives
back a JSON object. "in" has the items for the route list, without the key "zone". "out" has the
model names that only items of a different zone have. The model name of the enabled mock route
is not in "out". An item with no zone is in each zone. An
install with no zone makes no zone check, so each item is in its route list.
*/ -}}
{{- define "koodam.litellmRoutes" -}}
{{- $zone := .Values.zone.name -}}
{{- $in := list -}}
{{- $inNames := list -}}
{{- $outNames := list -}}
{{- range $i, $m := .Values.gateway.bundled.litellm.modelList -}}
{{- $item := printf "gateway.bundled.litellm.modelList[%d]" $i -}}
{{- $z := "" -}}
{{- if hasKey $m "zone" -}}
{{- if not (kindIs "string" $m.zone) -}}
{{- fail (printf "%s.zone must be a string." $item) -}}
{{- end -}}
{{- if not (and (kindIs "string" $m.model_name) $m.model_name) -}}
{{- fail (printf "%s.model_name is necessary for an item with a zone." $item) -}}
{{- end -}}
{{- $z = $m.zone -}}
{{- end -}}
{{- if or (not $zone) (not $z) (eq $z $zone) -}}
{{- $in = append $in (omit $m "zone") -}}
{{- $inNames = append $inNames $m.model_name -}}
{{- else -}}
{{- $outNames = append $outNames $m.model_name -}}
{{- end -}}
{{- end -}}
{{- /* The mock route is a route of the install, so its model name is not out of the zone. */ -}}
{{- if .Values.gateway.bundled.mock.enabled -}}
{{- $inNames = append $inNames .Values.gateway.bundled.mock.modelName -}}
{{- end -}}
{{- $out := list -}}
{{- range $outNames | uniq -}}
{{- if not (has . $inNames) -}}
{{- $out = append $out . -}}
{{- end -}}
{{- end -}}
{{- dict "in" $in "out" $out | toJson -}}
{{- end -}}
{{- define "koodam.litellmConfig" -}}
{{- $b := .Values.gateway.bundled -}}
{{- $routes := include "koodam.litellmRoutes" . | fromJson -}}
{{- if or $routes.in $b.mock.enabled -}}
model_list:
{{- with $routes.in }}
{{ toYaml . }}
{{- end }}
{{- if $b.mock.enabled }}
# LiteLLM answers with mock_response and calculates the spend from the cost per token.
- model_name: {{ $b.mock.modelName | quote }}
  litellm_params:
    model: {{ printf "openai/%s" $b.mock.modelName | quote }}
    api_key: not-used
    mock_response: {{ $b.mock.response | quote }}
    input_cost_per_token: {{ $b.mock.inputCostPerToken }}
    output_cost_per_token: {{ $b.mock.outputCostPerToken }}
{{- end }}
{{- else -}}
model_list: []
{{- end }}
{{- if $routes.out }}
litellm_settings:
  # koodam_zone.py refuses a call for a model route of a different zone (RouteOutOfZone).
  callbacks: koodam_zone.handler
{{- end }}
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: {{ $b.litellm.batchWriteSeconds }}
{{- end -}}
{{- if eq .Values.gateway.mode "bundled" }}
{{- $b := .Values.gateway.bundled }}
{{- $name := printf "%s-litellm" (include "koodam.fullname" .) }}
{{- $outOfZone := (include "koodam.litellmRoutes" . | fromJson).out }}
{{- $zoneHook := "" }}
{{- if $outOfZone }}
{{- $zoneHook = .Files.Get "files/litellm-zone-hook.py" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "koodam.litellmConfig" . | nindent 4 }}
  {{- with $zoneHook }}
  # The source is config/gateway/koodam_zone.py.
  koodam_zone.py: |
    {{- . | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
spec:
  # Keep 1 replica and 1 worker. The TestKey revoke depends on it (#192). Recreate stops the
  # old pod before the new pod starts, so an upgrade never runs 2 gateway instances.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "koodam.gatewaySelector" (list . "litellm") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart LiteLLM when the config changes.
        checksum/config: {{ printf "%s%s%s" (include "koodam.litellmConfig" .) $zoneHook (join "," $outOfZone) | sha256sum }}
      labels:
        {{- include "koodam.gatewaySelector" (list . "litellm") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml $b.litellm.podSecurityContext | nindent 8 }}
      containers:
      - name: litellm
        image: {{ $b.litellm.image }}
        securityContext:
          {{- toYaml $b.litellm.securityContext | nindent 10 }}
        args: [--config, /etc/litellm/config.yaml, --port, "4000"]
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.gateway.masterKeySecret.name }}
              key: {{ .Values.gateway.masterKeySecret.key }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "koodam.postgresSecret" . }}
              key: {{ $b.postgres.passwordSecret.key }}
        # Kubernetes puts the password into the URL. The password value is not in the pod spec.
        - name: DATABASE_URL
          value: {{ printf "postgresql://litellm:$(POSTGRES_PASSWORD)@%s-postgres.%s.svc:5432/litellm" (include "koodam.fullname" .) .Release.Namespace }}
        # The upstream provider keys. Each value comes from a Secret that you make.
        # The chart has no path for a literal value, so a key value is never in the release.
        {{- with $outOfZone }}
        # The zone hook refuses a call for these model names. They are the routes of other zones.
        - name: KOODAM_ZONE
          value: {{ $.Values.zone.name | quote }}
        - name: KOODAM_OUT_OF_ZONE_MODELS
          value: {{ toJson . | quote }}
        {{- end }}
        {{- range $i, $e := $b.litellm.extraEnvFromSecrets }}
        {{- $item := printf "gateway.bundled.litellm.extraEnvFromSecrets[%d]" $i }}
        {{- $envName := required (printf "%s.name is necessary." $item) $e.name }}
        {{- if has $envName (list "LITELLM_MASTER_KEY" "POSTGRES_PASSWORD" "DATABASE_URL" "KOODAM_ZONE" "KOODAM_OUT_OF_ZONE_MODELS") }}
        {{- fail (printf "%s.name must not be %s. The chart sets this variable." $item $envName) }}
        {{- end }}
        - name: {{ $envName | quote }}
          valueFrom:
            secretKeyRef:
              name: {{ required (printf "%s.secretName is necessary." $item) $e.secretName | quote }}
              key: {{ required (printf "%s.secretKey is necessary." $item) $e.secretKey | quote }}
        {{- end }}
        ports:
        - containerPort: 4000
          name: http
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          {{- toYaml $b.litellm.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/litellm
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: 4000
    targetPort: http
  selector:
    {{- include "koodam.gatewaySelector" (list . "litellm") | nindent 4 }}
{{- end }}
