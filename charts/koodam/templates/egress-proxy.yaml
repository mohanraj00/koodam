{{- $ep := .Values.egressProxy | default dict -}}
{{- if $ep.enabled }}
{{- if or (not $ep.httpPorts) (not $ep.connectPorts) }}
{{- fail "egressProxy.httpPorts and egressProxy.connectPorts must have items." }}
{{- end }}
{{- $name := printf "%s-egress-proxy" (include "koodam.fullname" .) -}}
{{- $np := dig "networkPolicy" dict (.Values.workspace | default dict) | default dict -}}
{{- $namespaces := $np.namespaces | default list -}}
{{- $epnp := $ep.networkPolicy | default dict -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
---
# The proxy finds the pod of a call from the source IP. It reads the pod labels and the pod IPs.
{{- if $namespaces }}
{{- range $ns := $namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "koodam.labels" $ | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "koodam.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
---
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # The pods use this fixed address as their DNS server and their proxy.
  clusterIP: {{ required "egressProxy.clusterIP is necessary if egressProxy.enabled is true." $ep.clusterIP | quote }}
  selector:
    {{- include "koodam.gatewaySelector" (list . "egress-proxy") | nindent 4 }}
  ports:
  - name: proxy
    protocol: TCP
    port: {{ $ep.port }}
    targetPort: proxy
  - name: dns
    protocol: UDP
    port: 53
    targetPort: dns
  - name: dns-tcp
    protocol: TCP
    port: 53
    targetPort: dns-tcp
  - name: tls
    protocol: TCP
    port: 443
    targetPort: tls
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress-proxy
spec:
  replicas: {{ $ep.replicas }}
  selector:
    matchLabels:
      {{- include "koodam.gatewaySelector" (list . "egress-proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "koodam.gatewaySelector" (list . "egress-proxy") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: proxy
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /egress-proxy
        args:
        - "--listen=:{{ $ep.port }}"
        - --probe-address=:8081
        - "--gateway-url={{ include "koodam.gatewayUrl" . }}"
        - "--http-ports={{ join "," $ep.httpPorts }}"
        - "--connect-ports={{ join "," $ep.connectPorts }}"
        - "--answer-ip={{ $ep.clusterIP }}"
        - "--cluster-dns={{ $ep.dns.clusterDNS }}"
        - "--cluster-domain={{ $ep.dns.clusterDomain }}"
        - --tls-listen=:8443
        - --http-listen=:8080
        {{- with $namespaces }}
        - "--namespaces={{ join "," . }}"
        {{- end }}
        ports:
        - containerPort: {{ $ep.port }}
          name: proxy
          protocol: TCP
        - containerPort: 5353
          name: dns
          protocol: UDP
        - containerPort: 5353
          name: dns-tcp
          protocol: TCP
        - containerPort: 8443
          name: tls
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
        resources:
          {{- toYaml $ep.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The proxy waits at most 5 seconds for the open calls, and 5 seconds for the probe server.
      terminationGracePeriodSeconds: 15
{{- if $epnp.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "koodam.gatewaySelector" (list . "egress-proxy") | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only the Agent and Workspace pods can use the proxy. The proxy also refuses a call from a pod
  # that it cannot find in its pod watch.
  - from:
    {{- range $label := list "koodam.dev/agent" "koodam.dev/workspace" }}
    - namespaceSelector: {}
      podSelector:
        matchExpressions:
        - key: {{ $label }}
          operator: Exists
    {{- end }}
    ports:
    - protocol: TCP
      port: {{ $ep.port }}
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 8080
  # The kubelet probes. Some network plugins apply the policy to the traffic from the node.
  - ports:
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $np.dns.namespace }}
      podSelector:
        matchLabels:
          {{- toYaml $np.dns.podLabels | nindent 10 }}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  {{- if eq .Values.gateway.mode "bundled" }}
  - to:
    - podSelector:
        matchLabels:
          {{- include "koodam.gatewaySelector" (list . "litellm") | nindent 10 }}
    ports:
    - protocol: TCP
      port: 4000
  {{- end }}
  {{- if not $epnp.apiServer }}
  {{- fail "egressProxy.networkPolicy.apiServer is necessary if egressProxy.networkPolicy.enabled is true." }}
  {{- end }}
  {{- toYaml $epnp.apiServer | nindent 2 }}
  - to:
    {{- include "koodam.publicPeers" $np.blockedCIDRs | nindent 4 }}
    ports:
    {{- range (concat $ep.httpPorts $ep.connectPorts | uniq) }}
    - protocol: TCP
      port: {{ int . }}
    {{- end }}
  {{- with $epnp.extraEgress }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
