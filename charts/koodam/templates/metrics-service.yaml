{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  # A Service name has 63 characters or fewer.
  name: {{ include "koodam.fullname" . | trunc 47 | trimSuffix "-" }}-metrics-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
spec:
  ports:
  - name: https
    port: {{ .Values.metrics.port }}
    protocol: TCP
    targetPort: {{ .Values.metrics.port }}
  selector:
    {{- include "koodam.selectorLabels" . | nindent 4 }}
{{- end }}
