{{- if not (has .Values.gateway.mode (list "existing" "bundled")) }}
{{- fail "gateway.mode must be \"existing\" or \"bundled\"." }}
{{- end }}
{{- if or (lt (int64 .Values.jobTTLSeconds) 60) (gt (int64 .Values.jobTTLSeconds) 2147483647) }}
{{- fail "jobTTLSeconds must be from 60 to 2147483647." }}
{{- end }}
{{- $claim := and .Values.apps.enabled .Values.apps.claimCheck.issuer }}
{{- if and $claim (not .Values.egressProxy.enabled) }}
{{- fail "apps.claimCheck needs egressProxy.enabled, because only the NetworkPolicy of a version blocks a call with no claim." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "koodam.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "koodam.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- if $claim }}
        # A new JWKS starts the manager again, because the manager reads the file at its start.
        checksum/app-claim-jwks: {{ .Values.apps.claimCheck.jwks | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "koodam.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "koodam.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- end }}
        {{- if .Values.leaderElection }}
        - --leader-elect
        {{- end }}
        - --health-probe-bind-address=:8081
        - --gateway-url={{ include "koodam.gatewayUrl" . }}
        - --gateway-master-key-file=/etc/koodam/gateway/master-key
        {{- with .Values.gateway.agentUrl }}
        - --agent-gateway-url={{ . }}
        {{- end }}
        - --key-grace={{ .Values.keyGrace }}
        {{- with .Values.zone.name }}
        {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" .) }}
        {{- fail "zone.name must be a DNS label: lower case letters, digits and \"-\", with 63 characters at most." }}
        {{- end }}
        - {{ printf "--zone=%s" . | quote }}
        {{- end }}
        {{- with .Values.zone.namespaces }}
        # The manager reads only the namespaces of this install, and its own namespace.
        - {{ printf "--watch-namespaces=%s" (join "," (prepend . $.Release.Namespace | uniq)) | quote }}
        {{- end }}
        {{- if eq .Values.gateway.mode "bundled" }}
        # The bundled gateway has 1 replica and 1 worker. Only then is a block a fence, so
        # only then does the controller issue TestKeys (#192).
        - --test-key-single-instance-gateway
        {{- end }}
        - --job-ttl-seconds={{ int64 .Values.jobTTLSeconds }}
        - "--installer-image={{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        - "--workspace-image={{ include "koodam.workspaceImage" . }}"
        {{- with (.Values.nookku | default dict).image }}
        {{- if not (regexMatch "^[^@\\s]+@sha256:[0-9a-f]{64}$" .) }}
        {{- fail "nookku.image must end with a digest @sha256:<64 hex characters>." }}
        {{- end }}
        - "--nookku-image={{ . }}"
        {{- end }}
        {{- if .Values.egressProxy.enabled }}
        # The Agent and Workspace pods use the proxy as their DNS server and their gateway (#142).
        - --egress-proxy-ip={{ .Values.egressProxy.clusterIP }}
        - --egress-proxy-port={{ int64 .Values.egressProxy.port }}
        - --cluster-domain={{ .Values.egressProxy.dns.clusterDomain }}
        {{- end }}
        {{- if .Values.apps.enabled }}
        - --apps-enabled
        - {{ printf "--tenant-usage-interval=%s" .Values.tenants.usageInterval | quote }}
        {{- $rate := .Values.tenants.defaultQuota.rateLimit }}
        {{- if or .Values.tenants.refuseUnknown $rate.requestsPerSecond $rate.burst }}
        {{- if not (and $claim .Values.apps.claimCheck.tenantClaim) }}
        {{- fail "tenants.defaultQuota and tenants.refuseUnknown need apps.claimCheck.issuer and apps.claimCheck.tenantClaim, because the claim check has no tenant label without them." }}
        {{- end }}
        {{- with $rate.requestsPerSecond }}
        - {{ printf "--tenant-default-rate=%v" . | quote }}
        {{- end }}
        {{- with $rate.burst }}
        - {{ printf "--tenant-default-burst=%d" (int64 .) | quote }}
        {{- end }}
        {{- if .Values.tenants.refuseUnknown }}
        - --tenant-refuse-unknown
        {{- end }}
        {{- end }}
        {{- if .Values.egressProxy.enabled }}
        # Each AppVersion gets a NetworkPolicy with egress to these pods only.
        - --egress-proxy-namespace={{ .Release.Namespace }}
        {{- $labels := list }}
        {{- range $k, $v := include "koodam.gatewaySelector" (list . "egress-proxy") | fromYaml }}
        {{- $labels = append $labels (printf "%s=%s" $k $v) }}
        {{- end }}
        - "--egress-proxy-pod-labels={{ join "," $labels }}"
        {{- with .Values.apps.ingressNamespaces }}
        - "--app-ingress-namespaces={{ join "," . }}"
        {{- end }}
        {{- end }}
        {{- if $claim }}
        {{- with .Values.apps.claimCheck }}
        # Each request to an App needs a signed claim of this issuer.
        - {{ printf "--app-claim-issuer=%s" .issuer | quote }}
        - {{ printf "--app-claim-audience=%s" (required "apps.claimCheck.audience is necessary with an issuer." .audience) | quote }}
        - {{ printf "--app-claim-caller-claim=%s" .callerClaim | quote }}
        - {{ printf "--app-claim-tenant-claim=%s" .tenantClaim | quote }}
        - --app-claim-jwks-file=/etc/koodam/app-claim/jwks.json
        {{- end }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
          protocol: TCP
        {{- end }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: gateway
          mountPath: /etc/koodam/gateway
          readOnly: true
        {{- if $claim }}
        - name: app-claim
          mountPath: /etc/koodam/app-claim
          readOnly: true
        {{- end }}
      volumes:
      {{- if $claim }}
      # The JWKS of the issuer of the App claim check. It has public keys only.
      - name: app-claim
        configMap:
          name: {{ include "koodam.fullname" . }}-app-claim-jwks
      {{- end }}
      # The master key is a file, never a flag value or an environment variable.
      - name: gateway
        secret:
          secretName: {{ .Values.gateway.masterKeySecret.name }}
          items:
          - key: {{ .Values.gateway.masterKeySecret.key }}
            path: master-key
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
