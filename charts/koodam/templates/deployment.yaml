{{- if not (has .Values.gateway.mode (list "existing" "bundled")) }}
{{- fail "gateway.mode must be \"existing\" or \"bundled\"." }}
{{- end }}
{{- if or (lt (int64 .Values.jobTTLSeconds) 60) (gt (int64 .Values.jobTTLSeconds) 2147483647) }}
{{- fail "jobTTLSeconds must be from 60 to 2147483647." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "koodam.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koodam.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "koodam.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "koodam.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "koodam.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- end }}
        {{- if .Values.leaderElection }}
        - --leader-elect
        {{- end }}
        - --health-probe-bind-address=:8081
        - --gateway-url={{ include "koodam.gatewayUrl" . }}
        - --gateway-master-key-file=/etc/koodam/gateway/master-key
        {{- with .Values.gateway.agentUrl }}
        - --agent-gateway-url={{ . }}
        {{- end }}
        - --key-grace={{ .Values.keyGrace }}
        - --job-ttl-seconds={{ int64 .Values.jobTTLSeconds }}
        - --installer-image={{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
          protocol: TCP
        {{- end }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: gateway
          mountPath: /etc/koodam/gateway
          readOnly: true
      volumes:
      # The master key is a file, never a flag value or an environment variable.
      - name: gateway
        secret:
          secretName: {{ .Values.gateway.masterKeySecret.name }}
          items:
          - key: {{ .Values.gateway.masterKeySecret.key }}
            path: master-key
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
