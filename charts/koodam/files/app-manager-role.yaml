---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - core.koodam.dev
  resources:
  - apps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - core.koodam.dev
  resources:
  - apps/finalizers
  - apps/status
  - appversions/finalizers
  - appversions/status
  verbs:
  - update
- apiGroups:
  - core.koodam.dev
  resources:
  - appversions
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - create
  - delete
  - get
  - list
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - get
  - update
